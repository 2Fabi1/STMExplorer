<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STM Stats</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16191d; --muted: #667085; --line: #e3e6ea;
    --accent: #2563eb; --accent-soft: #e8efff; --gold: #b7791f; --good: #15803d; --red: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --text: #e8eaed; --muted: #8b95a3; --line: #272d36;
      --accent: #6b9bff; --accent-soft: #1c2a47; --gold: #e3b341; --good: #4ade80; --red: #f87171;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --card: #171b21; --text: #e8eaed; --muted: #8b95a3; --line: #272d36;
    --accent: #6b9bff; --accent-soft: #1c2a47; --gold: #e3b341; --good: #4ade80; --red: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0; font-size: 14px; }
  .theme { background: var(--card); border: 1px solid var(--line); color: var(--text);
           border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 7px;
                cursor: pointer; font: inherit; }
  [hidden] { display: none !important; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  input[type=search] { flex: 1; min-width: 180px; background: var(--card); border: 1px solid var(--line);
                       color: var(--text); border-radius: 10px; padding: 8px 12px; font: inherit; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600;
       background: var(--card); position: sticky; top: 0; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--accent); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.player { cursor: pointer; }
  tr.player:hover td { background: var(--accent-soft); }
  .rank { color: var(--muted); width: 48px; font-variant-numeric: tabular-nums; }
  .rank.top { color: var(--gold); font-weight: 700; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .detail td { background: var(--bg); padding: 12px 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px;
          font-size: 13px; font-variant-numeric: tabular-nums; text-decoration: none; color: var(--text); }
  .sec + .sec { margin-top: 12px; }
  .sec summary { cursor: pointer; user-select: none; list-style: none; margin: 0 0 6px; font-size: 12px;
                 text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .sec summary::-webkit-details-marker { display: none; }
  .sec summary::before { content: "▾"; display: inline-block; width: 1.2em; }
  .sec:not([open]) summary { margin-bottom: 0; }
  .sec:not([open]) summary::before { content: "▸"; }
  .sec summary:hover { color: var(--accent); }
  .subbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .subbar .seg { background: var(--bg); }
  .muted { color: var(--muted); font-size: 13px; }
  .heading { padding: 12px 12px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
             color: var(--muted); font-weight: 600; border-top: 1px solid var(--line); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px;
         border: 1px solid #8b95a3; vertical-align: -1px; }
  /* fixed layout: column widths come from the <colgroup>, never from the names/values inside, so sorting can't shift them */
  .achv { table-layout: fixed; }
  .achv td, .achv th { white-space: nowrap; padding: 9px 10px; overflow: hidden; text-overflow: ellipsis; }
  .achv td:first-child, .achv th:first-child { position: sticky; left: 0; background: var(--card); z-index: 1; padding-left: 12px; }
  .achv td:nth-child(2), .achv th:nth-child(2) { position: sticky; left: 44px; background: var(--card); z-index: 1; }
  .prog .bar { height: 4px; margin-top: 4px; min-width: 0; }
  .prog.zero { color: var(--muted); }
  .prog.full { color: var(--good); font-weight: 600; }
  .prog.full .bar i { background: var(--good); }
  .chip.miss em { color: var(--gold); }
  .chip.tier1 em { color: var(--red); }
  .chip.tier2 em { color: var(--muted); }
  .chip em { font-style: normal; color: var(--good); margin-left: 4px; }
  .chip:hover { border-color: var(--accent); }
  .scroll { max-height: 70vh; overflow: auto; }
  .more { display: block; width: 100%; padding: 10px; border: 0; border-top: 1px solid var(--line);
          background: var(--card); color: var(--accent); cursor: pointer; font: inherit; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 13px; margin-top: 18px; }
  @media (max-width: 560px) { .hide-sm { display: none; } th, td { padding: 8px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>STM Stats</h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="theme" id="theme" title="Toggle theme">Theme</button>
  </header>

  <div class="controls">
    <div class="seg" id="sources" role="group" aria-label="Data source" hidden></div>
    <div class="seg" id="datasets" role="group" aria-label="Dataset"></div>
    <div class="seg" id="views" role="group" aria-label="View">
      <button data-view="players" aria-pressed="true">Players</button>
      <button data-view="tracks" aria-pressed="false">Tracks</button>
      <button data-view="improvements" aria-pressed="false">Improvements</button>
      <button data-view="news" aria-pressed="false">New STMs</button>
      <button data-view="achievements" aria-pressed="false">Achievements</button>
    </div>
    <input type="search" id="q" placeholder="Search player or track…" aria-label="Search">
  </div>

  <div class="controls" id="subtabs" hidden></div>

  <div class="stats" id="stats"></div>
  <div class="card"><div class="scroll" id="out"></div></div>
  <footer><span id="note"></span> <span id="gen"></span></footer>
</div>

<script>
const DATA = __DATA__;
const EVENTS = __EVENTS__;   // new STMs detected by the daily update (see update.py)
const META = __META__;       // update timestamps
const $ = (s) => document.querySelector(s);
const fmt = (ms) => { const m = Math.floor(ms / 60000), s = (ms % 60000) / 1000;
  return m ? `${m}:${s.toFixed(2).padStart(5, "0")}` : s.toFixed(2); };
const fv = (t, v) => t.mode === "score" ? String(v) : fmt(v);
const delta = (t, v) => v === t.set ? "equal" : t.mode === "score" ? `+${v - t.set}` : `−${((t.set - v) / 1000).toFixed(2)}`;
const missBy = (t, v) => t.mode === "score" ? `−${t.set - v}` : `+${((v - t.set) / 1000).toFixed(2)}`;
const link = (t) => `https://${t.site || "tmuf"}.exchange/trackshow/${t.id}`;
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k)); return n; };

// ---- Track classification: the track name encodes category, environment and difficulty.
const ENVS = ["Stadium", "Island", "Desert", "Rally", "Bay", "Coast", "Snow"];
const DIFFS = [["A", "White", "#f3f4f6"], ["B", "Green", "#22c55e"], ["C", "Blue", "#3b82f6"], ["D", "Red", "#ef4444"], ["E", "Black", "#111827"]];
const DIFF_NAME = Object.fromEntries(DIFFS.map(([c, n]) => [c, n]));
const U_RE = /^(Star)?(Stadium|Island|Desert|Rally|Bay|Coast|Snow)([A-E])\d?$/;
function classify(name) {
  const m = U_RE.exec(name);
  if (m) return { cat: "U", env: m[2], diff: m[3] };      // United: Nadeo tracks + Star tracks
  if (/^[A-E]\d\d-/.test(name)) return { cat: "N" };       // Nations (TMNF campaign)
  if (/^Puzzle/.test(name)) return { cat: "P" };
  if (/^Stunt/.test(name)) return { cat: "S" };
  return {};
}

// Merge every data file of a source into one dataset; players are merged by name for exchange replays
// (user ids differ between tmuf and tmnf) and by game login for United Ladder.
function merge(sets, source) {
  const tracks = sets.flatMap(d => d.tracks).map(t => ({ ...t, ...classify(t.name) }));
  const byId = new Map();
  for (const d of sets) for (const p of d.players) {
    const k = source === "ul" ? String(p.id).toLowerCase() : p.name.toLowerCase();   // ul: game login
    const m = byId.get(k) || { id: k, name: p.name, nick: p.nick, times: {}, miss: {} };
    Object.assign(m.times, p.times); Object.assign(m.miss, p.miss || {}); byId.set(k, m);
  }
  const players = [...byId.values()].map(p => ({ ...p, count: Object.keys(p.times).length }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  return { label: "All", tracks, players };
}

// The same data restricted to the tracks matching `pred`; players are re-counted on that subset.
function derive(all, label, pred) {
  const tracks = all.tracks.filter(pred), names = new Set(tracks.map(t => t.name));
  const pick = (o) => Object.fromEntries(Object.entries(o || {}).filter(([n]) => names.has(n)));
  const players = all.players.map(p => { const times = pick(p.times); return { ...p, times, miss: pick(p.miss), count: Object.keys(times).length }; })
    .filter(p => p.count > 0).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  return { label, tracks, players };
}

const DATASETS = [["U", "U-STM", "United STM: Nadeo + Star tracks"], ["N", "N-STM", "Nations STM"],
                  ["P", "P-STM", "Puzzle STM"], ["S", "S-STM", "Stunt STM"], ["ALL", "All", "Everything combined"]];
const SOURCES = [["tmx", "Exchange replays"], ["ul", "United Ladder"]].filter(([s]) => DATA.some(d => (d.source || "tmx") === s));
let source = SOURCES[0][0], all, ach = null, cur;
let ds = "U", sub = { diff: null, env: null };      // selected dataset; U-STM filters (null = All)

function pickDataset() {
  let pred = ds === "ALL" ? () => true : (t) => t.cat === ds, label = DATASETS.find(([k]) => k === ds)[1];
  if (ds === "U") {   // difficulty and environment are independent filters; null = All
    const { diff, env } = sub;
    pred = (t) => t.cat === "U" && (!diff || t.diff === diff) && (!env || t.env === env);
    if (diff) label += " · " + DIFF_NAME[diff];
    if (env) label += " · " + env;
  }
  cur = derive(all, label, pred);
}
function pickSource(s) {
  source = s;
  all = merge(DATA.filter(d => (d.source || "tmx") === s), s);
  ach = null;            // achievements are recomputed lazily for the new source
  pickDataset();
}
pickSource(source);
let view = "players", shown = 100, open = new Set();
const sort = { key: null, dir: "desc" };    // Tracks view sort state; key null = original order
const isort = { key: "pct", dir: "desc" };  // Improvements view sort state
const collapsed = new Set();                // titles of collapsed player-breakdown sections

// Sortable <th>: clicking sorts by `key` (first click: text asc, numbers desc), again flips the direction.
function sortTh(label, key, st, cls = "num", textKey = false) {
  const on = st.key === key;
  return el("th", { className: `${cls} sortable`, tabIndex: 0, textContent: label + (on ? (st.dir === "asc" ? " ▲" : " ▼") : ""),
    ariaSort: on ? (st.dir === "asc" ? "ascending" : "descending") : "none",
    onclick: () => { Object.assign(st, on ? { dir: st.dir === "desc" ? "asc" : "desc" }
                                          : { key, dir: textKey ? "asc" : "desc" }); render(); },
    onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.currentTarget.click(); } } });
}

function ranked(players) {
  let rank = 0, prev = null;
  return players.map((p, i) => { if (p.count !== prev) { rank = i + 1; prev = p.count; } return { ...p, rank }; });
}
const setOf = (d) => Object.fromEntries(d.tracks.map(t => [t.name, t]));

function renderStats() {
  const beaten = cur.tracks.filter(t => t.beaten_by > 0).length;
  const replays = cur.tracks.reduce((a, t) => a + t.replays, 0);
  const items = [[cur.tracks.length, "tracks"],
    [replays.toLocaleString(), source === "ul" ? "records on the leaderboards" : "replays checked"],
    [cur.players.length, "players beating ≥1 STM"], [`${beaten}/${cur.tracks.length}`, "tracks beaten by someone"]];
  $("#stats").replaceChildren(...items.map(([b, s]) => el("div", { className: "stat" }, el("b", { textContent: b }), el("span", { textContent: s }))));
}

function renderPlayers(q) {
  const total = cur.tracks.length, tmap = setOf(cur);
  let rows = ranked(cur.players);
  if (q) rows = rows.filter(p => p.name.toLowerCase().includes(q) || (p.nick || "").toLowerCase().includes(q));
  const tbody = el("tbody");
  rows.slice(0, shown).forEach(p => {
    const tr = el("tr", { className: "player" });
    tr.append(el("td", { className: "rank" + (p.rank <= 3 ? " top" : ""), textContent: p.rank }),
      el("td", { textContent: p.name, title: p.nick || "" }),
      el("td", { className: "num", textContent: `${p.count}/${total}` }),
      el("td", { className: "hide-sm" }, el("div", { className: "bar" }, Object.assign(el("i"), { style: `width:${100 * p.count / total}%` }))));
    tr.onclick = () => { open.has(p.id) ? open.delete(p.id) : open.add(p.id); render(); };
    tbody.append(tr);
    if (open.has(p.id)) {
      const chip = (name, v, miss, far) => {
        const t = tmap[name];
        return el("a", { className: "chip" + (miss ? " miss" : "") + (far != null ? ` tier${far}` : ""), href: link(t), target: "_blank", rel: "noopener" },
          name, el("em", { textContent: `${fv(t, v)} (${miss ? missBy(t, v) : delta(t, v)})` }));
      };
      const sec = (title, entries, miss, far) => {
        const d = el("details", { className: "sec", open: !collapsed.has(title) },
          el("summary", { textContent: `${title} (${entries.length})` }),
          el("div", { className: "chips" }, ...entries.map(([n, v]) => chip(n, v, miss, far))));
        d.ontoggle = () => { d.open ? collapsed.delete(title) : collapsed.add(title); };  // remembered across players
        return d;
      };
      const byName = (x, y) => x[0].localeCompare(y[0], undefined, { numeric: true });
      // Split misses into tiers by how far short of the set value they are (relative to it).
      const tiers = [[], [], []];
      for (const [n, v] of Object.entries(p.miss || {})) {
        const t = tmap[n], diff = t.mode === "score" ? t.set - v : v - t.set;
        tiers[diff * 1000 <= t.set ? 0 : diff * 200 <= t.set ? 1 : 2].push([n, v]);
      }
      const titles = ["Missing by 0.1% or less", "Missing by 0.1% – 0.5%", "Missing by more than 0.5%"];
      const cell = el("td", { colSpan: 4 }, sec("Beaten", Object.entries(p.times).sort(byName), false));
      tiers.forEach((list, i) => { if (list.length) cell.append(sec(titles[i], list.sort(byName), true, i)); });
      tbody.append(el("tr", { className: "detail" }, cell));
    }
  });
  const table = el("table", {}, el("thead", {}, el("tr", {},
    el("th", { textContent: "#" }), el("th", { textContent: "Player" }),
    el("th", { className: "num", textContent: "Tracks beaten" }), el("th", { className: "hide-sm", textContent: "" }))), tbody);
  const out = [rows.length ? table : el("div", { className: "empty", textContent: "No matching players." })];
  if (rows.length > shown) out.push(el("button", { className: "more", textContent: `Show more (${rows.length - shown} left)`,
    onclick: () => { shown += 200; render(); } }));
  return out;
}

// Players per STM holder: leaderboard size / players who beat it (10 000 players, 10 holders -> 1 000).
const NO_HOLDERS = 1e18;   // sentinel so STMs nobody has sort as the "rarest"
const pps = (t) => t.beaten_by ? t.replays / t.beaten_by : NO_HOLDERS;
const fmtPps = (t) => { const v = pps(t); return v === NO_HOLDERS ? "–" : v >= 10 ? Math.round(v).toLocaleString("en-US") : v.toFixed(1); };

function renderTracks(q) {
  let rows = cur.tracks.filter(t => !q || t.name.toLowerCase().includes(q));
  if (sort.key) {
    const sgn = sort.dir === "asc" ? 1 : -1;
    rows = rows.map((t, i) => [t, i]).sort(([a, i], [b, j]) =>
      sgn * (sort.key === "name" ? a.name.localeCompare(b.name, undefined, { numeric: true })
                                 : sort.key === "pps" ? pps(a) - pps(b)
                                 : a[sort.key] - b[sort.key]) || i - j).map(([t]) => t);
  }
  const tbody = el("tbody");
  rows.forEach(t => tbody.append(el("tr", {},
    el("td", {}, el("a", { href: link(t), target: "_blank", rel: "noopener", textContent: t.name })),
    el("td", { className: "num", textContent: fv(t, t.set) }),
    el("td", { className: "num", textContent: t.replays }),
    el("td", { className: "num", textContent: t.beaten_by }),
    el("td", { className: "num", textContent: fmtPps(t) }))));
  if (!rows.length) return [el("div", { className: "empty", textContent: "No matching tracks." })];
  const th = (label, key, cls = "num") => sortTh(label, key, sort, cls, key === "name");
  return [el("table", {}, el("thead", {}, el("tr", {},
    th("Track", "name", ""), el("th", { className: "num", textContent: "STM" }),
    th(source === "ul" ? "Records" : "Replays", "replays"), th("Beat it", "beaten_by"),
    th("Players/STM", "pps"))), tbody)];
}

function renderImprovements(q) {
  const tmap = setOf(cur);
  let rows = cur.players.flatMap(p => Object.entries(p.times).map(([name, v]) => {
    const t = tmap[name], abs = t.mode === "score" ? v - t.set : t.set - v;
    return { player: p.name, nick: p.nick, t, v, abs, pct: 100 * abs / t.set };
  })).filter(r => r.abs > 0 && (!q || r.player.toLowerCase().includes(q) || (r.nick || "").toLowerCase().includes(q) || r.t.name.toLowerCase().includes(q)));
  const sgn = isort.dir === "asc" ? 1 : -1;
  rows.sort((a, b) => sgn * (isort.key === "player" ? a.player.localeCompare(b.player)
    : isort.key === "track" ? a.t.name.localeCompare(b.t.name, undefined, { numeric: true })
    : a.pct - b.pct) || b.pct - a.pct);
  if (!rows.length) return [el("div", { className: "empty", textContent: "No improvements found." })];
  const tbody = el("tbody");
  rows.slice(0, shown).forEach((r, i) => tbody.append(el("tr", {},
    el("td", { className: "rank" + (i < 3 && isort.key === "pct" && isort.dir === "desc" ? " top" : ""), textContent: i + 1 }),
    el("td", { textContent: r.player }),
    el("td", {}, el("a", { href: link(r.t), target: "_blank", rel: "noopener", textContent: r.t.name })),
    el("td", { className: "num hide-sm", textContent: fv(r.t, r.t.set) }),
    el("td", { className: "num", textContent: fv(r.t, r.v) }),
    el("td", { className: "num", textContent: r.t.mode === "score" ? `+${r.abs} pts` : `−${(r.abs / 1000).toFixed(2)}s` }),
    el("td", { className: "num", textContent: r.pct.toFixed(2) + "%" }))));
  const out = [el("table", {}, el("thead", {}, el("tr", {},
    el("th", { textContent: "#" }), sortTh("Player", "player", isort, "", true), sortTh("Track", "track", isort, "", true),
    el("th", { className: "num hide-sm", textContent: "STM" }), el("th", { className: "num", textContent: "Result" }),
    el("th", { className: "num", textContent: "Improvement" }), sortTh("%", "pct", isort))), tbody)];
  if (rows.length > shown) out.push(el("button", { className: "more", textContent: `Show more (${rows.length - shown} left)`,
    onclick: () => { shown += 200; render(); } }));
  return out;
}

// --- New STMs: leaderboard + feed built from the event log written by update.py
const nw = { win: "7" };
const WINS = [["latest", "Latest update"], ["7", "7 days"], ["30", "30 days"], ["all", "All time"]];

function renderNew(q) {
  const tmap = setOf(cur), ref = Date.parse(META.updated) || Date.now();
  const inWin = (e) => nw.win === "all" || (nw.win === "latest" ? e.t === META.updated
                                                                 : Date.parse(e.t) > ref - Number(nw.win) * 864e5);
  const list = EVENTS.filter(e => e.source === source && tmap[e.track] && inWin(e) &&
    (!q || e.player.toLowerCase().includes(q) || (e.nick || "").toLowerCase().includes(q) || e.track.toLowerCase().includes(q)));

  const by = new Map();   // leaderboard: new STMs per player
  for (const e of list) {
    const k = e.player.toLowerCase(), g = by.get(k) || { id: "n:" + k, name: e.player, nick: e.nick, ev: [] };
    g.ev.push(e); by.set(k, g);
  }
  const board = [...by.values()].sort((a, b) => b.ev.length - a.ev.length || a.name.localeCompare(b.name));

  const bar = el("div", { className: "subbar" },
    el("div", { className: "seg" }, ...WINS.map(([k, label]) => el("button", {
      textContent: label, ariaPressed: String(nw.win === k), onclick: () => { nw.win = k; shown = 100; render(); } }))),
    el("span", { className: "muted", textContent: `${list.length} new STM${list.length === 1 ? "" : "s"} by ${board.length} player${board.length === 1 ? "" : "s"}` }));
  if (!list.length) {
    const since = META.since ? new Date(META.since).toLocaleDateString() : "";
    return [bar, el("div", { className: "empty", textContent: EVENTS.length
      ? "No new STMs in this window."
      : `No new STMs detected yet${since ? " (tracking since " + since + ")" : ""}. The data is refreshed every 24 hours; new STMs show up here after the next update.` })];
  }

  const evChip = (e) => {
    const t = tmap[e.track];
    return el("a", { className: "chip", href: link(t), target: "_blank", rel: "noopener", title: new Date(e.t).toLocaleString() },
      e.track, el("em", { textContent: `${fv(t, e.value)} (${delta(t, e.value)})` }));
  };
  let rank = 0, prev = null;
  const tbody = el("tbody");
  board.forEach((g, i) => {
    if (g.ev.length !== prev) { rank = i + 1; prev = g.ev.length; }
    const tr = el("tr", { className: "player" },
      el("td", { className: "rank" + (rank <= 3 ? " top" : ""), textContent: rank }),
      el("td", { textContent: g.name, title: g.nick || "" }),
      el("td", { className: "num", textContent: g.ev.length }));
    tr.onclick = () => { open.has(g.id) ? open.delete(g.id) : open.add(g.id); render(); };
    tbody.append(tr);
    if (open.has(g.id)) tbody.append(el("tr", { className: "detail" }, el("td", { colSpan: 3 },
      el("div", { className: "chips" }, ...g.ev.sort((a, b) => a.track.localeCompare(b.track, undefined, { numeric: true })).map(evChip)))));
  });
  const boardTable = el("table", {}, el("thead", {}, el("tr", {},
    el("th", { textContent: "#" }), el("th", { textContent: "Player" }), el("th", { className: "num", textContent: "New STMs" }))), tbody);

  const pct = (e) => { const t = tmap[e.track], abs = t.mode === "score" ? e.value - t.set : t.set - e.value; return abs / t.set; };
  const feed = [...list].sort((a, b) => Date.parse(b.t) - Date.parse(a.t) || pct(b) - pct(a));
  const fbody = el("tbody");
  feed.slice(0, shown).forEach(e => {
    const t = tmap[e.track];
    fbody.append(el("tr", {},
      el("td", { textContent: new Date(e.t).toLocaleDateString() }),
      el("td", { textContent: e.player, title: e.nick || "" }),
      el("td", {}, el("a", { href: link(t), target: "_blank", rel: "noopener", textContent: e.track })),
      el("td", { className: "num", textContent: fv(t, e.value) }),
      el("td", { className: "num", textContent: delta(t, e.value) })));
  });
  const feedTable = el("table", {}, el("thead", {}, el("tr", {},
    el("th", { textContent: "Detected" }), el("th", { textContent: "Player" }), el("th", { textContent: "Track" }),
    el("th", { className: "num", textContent: "Result" }), el("th", { className: "num", textContent: "vs STM" }))), fbody);
  const out = [bar, boardTable, el("div", { className: "heading", textContent: "Recent new STMs" }), feedTable];
  if (feed.length > shown) out.push(el("button", { className: "more", textContent: `Show more (${feed.length - shown} left)`,
    onclick: () => { shown += 200; render(); } }));
  return out;
}

// --- Achievements: progress towards the tags
const TAGS_PRIMARY = [
  { id: "U", name: "United STM", pred: t => t.cat === "U" },
  { id: "N", name: "Nations STM", pred: t => t.cat === "N" },
  { id: "P", name: "Puzzle STM", pred: t => t.cat === "P" },
  { id: "S", name: "Stunt STM", pred: t => t.cat === "S" },
];
const TAGS_DIFF = DIFFS.map(([c, name, dot]) => ({ id: "d" + c, name, dot, pred: t => t.cat === "U" && t.diff === c }));
const TAGS_ENV = ENVS.map(env => ({ id: "e" + env, name: env, pred: t => t.cat === "U" && t.env === env }));
const TAGS_UNITED = [...TAGS_DIFF, ...TAGS_ENV];
const am = { mode: "primary", group: "diff" };        // primary tags, or United sub-tags by difficulty / environment
const asort = { key: "default", dir: "desc" };        // "default" = most tags done, then closest overall

function achievementData() {
  if (ach) return ach;
  const tags = [...TAGS_PRIMARY, ...TAGS_UNITED].map(tg => {
    const names = new Set(all.tracks.filter(tg.pred).map(t => t.name));
    return { ...tg, names, total: names.size };
  });
  const players = all.players.map(p => {
    const n = {};
    for (const tg of tags) { let c = 0; for (const name in p.times) if (tg.names.has(name)) c++; n[tg.id] = c; }
    return { id: p.id, name: p.name, nick: p.nick, n };
  });
  return (ach = { tags, players });
}

function renderAchievements(q) {
  const A = achievementData();
  const group = am.mode === "primary" ? TAGS_PRIMARY : am.group === "diff" ? TAGS_DIFF : TAGS_ENV;
  const tags = group.map(g => A.tags.find(t => t.id === g.id)).filter(t => t.total > 0);
  const isDone = (p, t) => p.n[t.id] === t.total;
  const done = (p) => tags.filter(t => isDone(p, t)).length;
  const frac = (p) => tags.reduce((sum, t) => sum + p.n[t.id] / t.total, 0);
  const byDefault = (a, b) => done(b) - done(a) || frac(b) - frac(a) || a.name.localeCompare(b.name);   // best first

  let rows = A.players.filter(p => tags.some(t => p.n[t.id] > 0) &&
    (!q || p.name.toLowerCase().includes(q) || (p.nick || "").toLowerCase().includes(q)));
  const useKey = asort.key !== "default" && tags.some(t => t.id === asort.key);
  rows.sort((a, b) => {
    const cmp = useKey ? (b.n[asort.key] - a.n[asort.key]) || byDefault(a, b) : byDefault(a, b);
    return asort.dir === "desc" ? cmp : -cmp;
  });

  const segment = (key, options) => el("div", { className: "seg" }, ...options.map(([k, label]) => el("button", {
    textContent: label, ariaPressed: String(am[key] === k), onclick: () => { am[key] = k; shown = 100; render(); } })));
  const bar = el("div", { className: "subbar" },
    segment("mode", [["primary", "Primary tags (Nadeo)"], ["united", "United sub-tags (bronze)"]]),
    ...(am.mode === "united" ? [segment("group", [["diff", "Difficulty"], ["env", "Environment"]])] : []),
    el("span", { className: "muted", textContent: "Beat the STM on every track of a tag to earn it · click a column to sort" }));
  if (!rows.length) return [bar, el("div", { className: "empty", textContent: "No matching players." })];

  const th = (t) => {
    const on = asort.key === t.id;
    return el("th", { className: "num sortable", tabIndex: 0, title: `${t.total} tracks`,
      ariaSort: on ? (asort.dir === "asc" ? "ascending" : "descending") : "none",
      onclick: () => { Object.assign(asort, on ? { dir: asort.dir === "desc" ? "asc" : "desc" } : { key: t.id, dir: "desc" }); render(); },
      onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.currentTarget.click(); } } },
      ...(t.dot ? [el("i", { className: "dot", style: `background:${t.dot}` })] : []),
      t.name + (on ? (asort.dir === "asc" ? " ▲" : " ▼") : ""));
  };
  const doneTh = (() => {   // "Tags" = how many tags the player has completed; also restores the default order
    const on = asort.key === "default";
    return el("th", { className: "num sortable", tabIndex: 0, textContent: "Tags" + (on ? (asort.dir === "asc" ? " ▲" : " ▼") : ""),
      onclick: () => { Object.assign(asort, on ? { dir: asort.dir === "desc" ? "asc" : "desc" } : { key: "default", dir: "desc" }); render(); } });
  })();
  const head = el("thead", {},
    el("tr", {}, el("th", { textContent: "#" }), el("th", { textContent: "Player" }), ...tags.map(th), doneTh));

  const tbody = el("tbody");
  rows.slice(0, shown).forEach((p, i) => tbody.append(el("tr", {},
    el("td", { className: "rank" + (i < 3 && asort.key === "default" && asort.dir === "desc" ? " top" : ""), textContent: i + 1 }),
    el("td", { textContent: p.name, title: p.nick ? `${p.name} — ${p.nick}` : p.name }),
    ...tags.map(t => {
      const n = p.n[t.id], full = n === t.total;
      return el("td", { className: "num prog" + (full ? " full" : n === 0 ? " zero" : "") },
        `${full ? "✓ " : ""}${n}/${t.total}`,
        el("div", { className: "bar" }, Object.assign(el("i"), { style: `width:${100 * n / t.total}%` })));
    }),
    el("td", { className: "num", textContent: `${done(p)}/${tags.length}` }))));
  const W = { rank: 44, player: 170, tag: 88, done: 70 };   // fixed column widths (px); the tag columns share the rest
  const cols = el("colgroup", {}, el("col", { style: `width:${W.rank}px` }), el("col", { style: `width:${W.player}px` }),
    ...tags.map(() => el("col")), el("col", { style: `width:${W.done}px` }));
  const minWidth = W.rank + W.player + W.done + tags.length * W.tag;   // narrower screens scroll sideways instead of squeezing
  const out = [bar, el("table", { className: "achv", style: `min-width:${minWidth}px` }, cols, head, tbody)];
  if (rows.length > shown) out.push(el("button", { className: "more", textContent: `Show more (${rows.length - shown} left)`,
    onclick: () => { shown += 200; render(); } }));
  return out;
}

const NOTES = {
  common: "A time faster than or equal to the STM (or, on stunt tracks, a score higher than or equal to it) counts as a beat; each player counts at most once per track.",
  tmx: "Data: replays uploaded to tmuf.exchange and tmnf.exchange. Players are matched by name, because user ids differ between tmuf and tmnf.",
  ul: "Data: the official in-game leaderboards via the UnitedLadder API (api.ul.unitedascenders.xyz); players are matched by game login. Only results up to 0.5% behind an STM were fetched, so there is no \"more than 0.5%\" tier.",
};
const SUBS = { tmx: "How many tracks each player has a replay faster than the STM · data from tmuf.exchange & tmnf.exchange",
               ul: "How many tracks each player has an official record faster than the STM · data from UnitedLadder" };

function render() {
  const q = $("#q").value.trim().toLowerCase();
  $("#sub").textContent = SUBS[source];
  $("#note").textContent = `${NOTES.common} ${NOTES[source]}`;
  $("#gen").textContent = META.updated ? `Data updated ${new Date(META.updated).toLocaleString()}.` : "Generated __GENERATED__.";
  $("#stats").hidden = view === "achievements";
  if (view !== "achievements") renderStats();
  $("#out").replaceChildren(...({ players: renderPlayers, tracks: renderTracks, improvements: renderImprovements,
                                  news: renderNew, achievements: renderAchievements }[view](q)));
}

function buildDatasetButtons() {
  $("#datasets").hidden = view === "achievements";      // achievements span every dataset
  $("#datasets").replaceChildren(...DATASETS.map(([k, label, tip]) => el("button", {
    textContent: label, title: tip, ariaPressed: String(k === ds),
    onclick: () => { ds = k; sub = { diff: null, env: null }; pickDataset(); shown = 100; open.clear();
      buildDatasetButtons(); buildSubButtons(); render(); } })));
}
function buildSubButtons() {   // U-STM filters: a difficulty row and an environment row, each with "All"
  const box = $("#subtabs");
  box.hidden = !(ds === "U" && view !== "achievements");
  if (box.hidden) return;
  const choose = (key, value) => { sub = { ...sub, [key]: value }; pickDataset(); shown = 100; open.clear(); buildSubButtons(); render(); };
  const mk = (label, key, value, dot) => el("button", {
    ariaPressed: String(sub[key] === value), onclick: () => choose(key, value) },
    ...(dot ? [el("i", { className: "dot", style: `background:${dot}` })] : []), label);
  box.replaceChildren(
    el("div", { className: "seg", role: "group", ariaLabel: "Difficulty" },
      mk("All", "diff", null), ...DIFFS.map(([c, n, dot]) => mk(n, "diff", c, dot))),
    el("div", { className: "seg", role: "group", ariaLabel: "Environment" },
      mk("All", "env", null), ...ENVS.map(e => mk(e, "env", e))));
}
function buildSourceButtons() {
  $("#sources").hidden = SOURCES.length < 2;
  $("#sources").replaceChildren(...SOURCES.map(([id, label]) => el("button", {
    textContent: label, ariaPressed: String(id === source),
    onclick: () => { pickSource(id); shown = 100; open.clear(); buildSourceButtons(); buildDatasetButtons(); buildSubButtons(); render(); } })));
}
buildSourceButtons();
buildDatasetButtons();
buildSubButtons();
document.querySelectorAll("#views button").forEach(b => b.onclick = () => {
  view = b.dataset.view; shown = 100;
  document.querySelectorAll("#views button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  buildDatasetButtons(); buildSubButtons(); render(); });
$("#q").oninput = () => { shown = 100; render(); };
$("#theme").onclick = () => {
  const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = r.dataset.theme || (dark ? "dark" : "light");
  r.dataset.theme = now === "dark" ? "light" : "dark"; };
render();
</script>
