<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STM Stats</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16191d; --muted: #667085; --line: #e3e6ea;
    --accent: #2563eb; --accent-soft: #e8efff; --gold: #b7791f; --silver: #6b7280; --bronze: #b45309; --good: #15803d; --red: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --text: #e8eaed; --muted: #8b95a3; --line: #272d36;
      --accent: #6b9bff; --accent-soft: #1c2a47; --gold: #e3b341; --silver: #cbd5e1; --bronze: #d9822b; --good: #4ade80; --red: #f87171;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --card: #171b21; --text: #e8eaed; --muted: #8b95a3; --line: #272d36;
    --accent: #6b9bff; --accent-soft: #1c2a47; --gold: #e3b341; --silver: #cbd5e1; --bronze: #d9822b; --good: #4ade80; --red: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0; font-size: 14px; }
  .theme { background: var(--card); border: 1px solid var(--line); color: var(--text);
           border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 7px;
                cursor: pointer; font: inherit; }
  [hidden] { display: none !important; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 220px; font-size: 12px; color: var(--muted); }
  .field input { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
                 padding: 8px 12px; font: inherit; font-size: 15px; }
  input[type=search] { flex: 1; min-width: 180px; background: var(--card); border: 1px solid var(--line);
                       color: var(--text); border-radius: 10px; padding: 8px 12px; font: inherit; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600;
       background: var(--card); position: sticky; top: 0; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: var(--accent); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.player { cursor: pointer; }
  tr.player:hover td { background: var(--accent-soft); }
  .rank { color: var(--muted); width: 48px; font-variant-numeric: tabular-nums; }
  .rank.top { color: var(--gold); font-weight: 700; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .detail td { background: var(--bg); padding: 12px 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px;
          font-size: 13px; font-variant-numeric: tabular-nums; text-decoration: none; color: var(--text); }
  .sec + .sec { margin-top: 12px; }
  .sec summary { cursor: pointer; user-select: none; list-style: none; margin: 0 0 6px; font-size: 12px;
                 text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .sec summary::-webkit-details-marker { display: none; }
  .sec summary::before { content: "▾"; display: inline-block; width: 1.2em; }
  .sec:not([open]) summary { margin-bottom: 0; }
  .sec:not([open]) summary::before { content: "▸"; }
  .sec summary:hover { color: var(--accent); }
  .subbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .subbar .seg { background: var(--bg); }
  .muted { color: var(--muted); font-size: 13px; }
  .mhead { padding: 14px 14px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
           color: var(--muted); font-weight: 600; }
  .mhead:not(:first-child) { border-top: 1px solid var(--line); margin-top: 6px; }
  .mpad { padding: 0 14px 12px; }
  .mpad .stats { margin: 10px 0 0; }
  .mpad .sec { margin-top: 10px; }
  .notice { margin: 12px 14px 0; padding: 10px 12px; border: 1px solid var(--gold); border-radius: 10px; color: var(--gold); font-size: 13px; }
  .grouprow td { background: var(--bg); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px;
         border: 1px solid #8b95a3; vertical-align: -1px; }
  /* fixed layout: column widths come from the <colgroup>, never from the names/values inside, so sorting can't shift them */
  .achv { table-layout: fixed; }
  .achv td, .achv th { white-space: nowrap; padding: 9px 10px; overflow: hidden; text-overflow: ellipsis; }
  .achv td:first-child, .achv th:first-child { position: sticky; left: 0; background: var(--card); z-index: 1; padding-left: 12px; }
  .achv td:nth-child(2), .achv th:nth-child(2) { position: sticky; left: 44px; background: var(--card); z-index: 1; }
  .prog .bar { height: 4px; margin-top: 4px; min-width: 0; }
  .prog.zero { color: var(--muted); }
  .prog.full { color: var(--good); font-weight: 600; }
  .prog.full .bar i { background: var(--good); }
  .pcell { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .tags { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px; }
  .tagimg { height: 30px; width: auto; display: block; }   /* the game's tag plaques are 150x64 */
  /* hover picture on the Achievements columns */
  .tagpop { position: fixed; z-index: 70; pointer-events: none; background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .tagpop img { display: block; width: 250px; height: auto; }
  /* track popup */
  tr.track { cursor: pointer; }
  tr.track:hover td { background: var(--accent-soft); }
  .tlink { color: var(--accent); }
  .overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); display: flex; align-items: center;
             justify-content: center; padding: 16px; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: min(460px, 100%);
           max-height: 90vh; overflow: auto; padding: 16px 18px 14px; box-shadow: 0 16px 50px rgba(0,0,0,.5); }
  .mtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mtop h2 { margin: 0; font-size: 20px; }
  .x { border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; border-radius: 8px; padding: 4px 8px; }
  .x:hover { color: var(--text); background: var(--accent-soft); }
  .msec { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .mname { flex: 1; }
  .mval { font-variant-numeric: tabular-nums; }
  .medal { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;
           font-size: 12px; font-weight: 800; color: #fff; border: 2px solid transparent; flex: none; }
  .medal.stm { background: #16a34a; border-color: #4ade80; box-shadow: 0 0 8px #4ade8099; }
  .medal.sg { background: #b7791f; border-color: #fcd34d; }
  .medal.ss { background: #6b7280; border-color: #e5e7eb; }
  .medal.sb { background: #9a5a1f; border-color: #e0903d; }
  .mrow.hoverable { cursor: help; border-radius: 8px; }
  .mrow.hoverable:hover, .mrow.hoverable:focus-visible { background: var(--accent-soft); outline: none; }
  .duckpop { position: fixed; z-index: 80; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
             padding: 8px 12px; box-shadow: 0 8px 30px rgba(0,0,0,.4); font-size: 13px; min-width: 200px; max-width: 320px; }
  .duckpop .dhead { color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
  .duckpop .drow { display: flex; justify-content: space-between; gap: 16px; padding: 1px 0; }
  .duckpop .drow b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .medal.duck { background: #dc2626; border-color: #f87171; box-shadow: 0 0 8px #f8717199; }
  .medal.rtm { background: #14532d; border-color: #3f7a4f; }
  .mholder { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .dl { display: inline-block; padding: 7px 12px; border-radius: 9px; background: var(--accent-soft); font-weight: 600; text-decoration: none; }
  .mfoot { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .chip.miss em { color: var(--gold); }
  .chip.tier0 em { color: var(--gold); }      /* Super Gold */
  .chip.tier1 em { color: var(--silver); }    /* Super Silver */
  .chip.tier2 em { color: var(--bronze); }    /* Super Bronze */
  .chip.tier3 em { color: var(--muted); }     /* slower than Super Bronze */
  .chip em { font-style: normal; color: var(--good); margin-left: 4px; }
  .chip:hover { border-color: var(--accent); }
  .scroll { max-height: 70vh; overflow: auto; }
  .more { display: block; width: 100%; padding: 10px; border: 0; border-top: 1px solid var(--line);
          background: var(--card); color: var(--accent); cursor: pointer; font: inherit; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 13px; margin-top: 18px; }
  @media (max-width: 560px) { .hide-sm { display: none; } th, td { padding: 8px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>STM Stats</h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="theme" id="theme" title="Toggle theme">Theme</button>
  </header>

  <div class="controls">
    <div class="seg" id="sources" role="group" aria-label="Data source" hidden></div>
    <div class="seg" id="datasets" role="group" aria-label="Dataset"></div>
    <div class="seg" id="views" role="group" aria-label="View">
      <button data-view="players" aria-pressed="true">Players</button>
      <button data-view="tracks" aria-pressed="false">Tracks</button>
      <button data-view="improvements" aria-pressed="false">Improvements</button>
      <button data-view="news" aria-pressed="false">New STMs</button>
      <button data-view="achievements" aria-pressed="false">Achievements</button>
      <button data-view="merge" aria-pressed="false">Merge</button>
    </div>
    <input type="search" id="q" placeholder="Search player or track…" aria-label="Search">
  </div>

  <div class="controls" id="mergebar" hidden>
    <label class="field">United Ladder login
      <input type="text" id="mg-ul" list="dl-ul" placeholder="your in-game login" autocomplete="off" spellcheck="false"></label>
    <label class="field">Exchange name
      <input type="text" id="mg-ex" list="dl-ex" placeholder="your name on tmuf / tmnf.exchange" autocomplete="off" spellcheck="false"></label>
    <datalist id="dl-ul"></datalist><datalist id="dl-ex"></datalist>
  </div>

  <div class="controls" id="subtabs" hidden></div>

  <div class="stats" id="stats"></div>
  <div class="card"><div class="scroll" id="out"><p class="muted" style="padding:16px">Loading data…</p></div></div>
  <footer><span id="note"></span> <span id="gen"></span> <a id="csv" href="stm-data.csv" download hidden>Download all data (CSV)</a></footer>
</div>

<!-- The page code below does not run until site-data.json (every track and player) has been fetched; see the loader at the end. -->
<script type="text/plain" id="app">
const DATA = window.SITE_DATA.data;
const EVENTS = window.SITE_DATA.events;   // new STMs detected by the daily update (see update.py)
const META = window.SITE_DATA.meta;       // update timestamps
const DUCKS = window.SITE_DATA.ducks || {};   // track name -> duck time in ms (ducks.csv); faster than the STM
const $ = (s) => document.querySelector(s);
const fmt = (ms) => { const m = Math.floor(ms / 60000), s = (ms % 60000) / 1000;
  return m ? `${m}:${s.toFixed(2).padStart(5, "0")}` : s.toFixed(2); };
const fv = (t, v) => t.mode === "score" ? String(v) : fmt(v);
const delta = (t, v) => v === t.set ? "equal" : t.mode === "score" ? `+${v - t.set}` : `−${((t.set - v) / 1000).toFixed(2)}`;
const missBy = (t, v) => t.mode === "score" ? `−${t.set - v}` : `+${((v - t.set) / 1000).toFixed(2)}`;
const link = (t) => `https://${t.site || "tmuf"}.exchange/trackshow/${t.id}`;
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k)); return n; };

// ---- Track classification: the track name encodes category, environment and difficulty.
const ENVS = ["Stadium", "Island", "Desert", "Rally", "Bay", "Coast", "Snow"];
const DIFFS = [["A", "White", "#f3f4f6"], ["B", "Green", "#22c55e"], ["C", "Blue", "#3b82f6"], ["D", "Red", "#ef4444"], ["E", "Black", "#111827"]];
const DIFF_NAME = Object.fromEntries(DIFFS.map(([c, n]) => [c, n]));

// ---- Medals. The RTM is the track's author medal; relative to the STM, Super Gold / Silver / Bronze lie
// 12.5% / 25% / 50% of the way from the STM towards the RTM, rounded UP (to the next hundredth of a second, or to a
// whole point for stunt scores), so StadiumA1 (STM 22.08, RTM 22.87) has 22.18 / 22.28 / 22.48.
const MEDALS = [{ id: "stm", name: "STM", f: 0 }, { id: "sg", name: "Super Gold", f: 0.125 },
                { id: "ss", name: "Super Silver", f: 0.25 }, { id: "sb", name: "Super Bronze", f: 0.5 }];
const medalLimit = (t, f) => {
  if (t.rtm == null) return t.set;
  const x = t.set + f * (t.rtm - t.set);                 // exact in floating point: f is 1/8, 1/4 or 1/2
  return t.mode === "score" ? Math.ceil(x) : Math.ceil(x / 10) * 10;
};
const within = (t, v, limit) => t.mode === "score" ? v >= limit : v <= limit;   // time: lower is better; score: higher
// 0 = beats the STM, 1 / 2 / 3 = Super Gold / Silver / Bronze, 4 = slower than Super Bronze
function medalTier(t, v) {
  if (within(t, v, t.set)) return 0;
  for (let k = 1; k <= 3; k++) if (within(t, v, medalLimit(t, MEDALS[k].f))) return k;
  return 4;
}
const U_RE = /^(Star)?(Stadium|Island|Desert|Rally|Bay|Coast|Snow)([A-E])\d?$/;
function classify(name) {
  const m = U_RE.exec(name);
  if (m) return { cat: "U", env: m[2], diff: m[3] };      // United: Nadeo tracks + Star tracks
  if (/^[A-E]\d\d-/.test(name)) return { cat: "N" };       // Nations (TMNF campaign)
  if (/^Puzzle/.test(name)) return { cat: "P" };
  if (/^Stunt/.test(name)) return { cat: "S" };
  return {};
}

// Merge every data file of a source into one dataset; players are merged by name for exchange replays
// (user ids differ between tmuf and tmnf) and by game login for United Ladder.
function merge(sets, source) {
  const tracks = sets.flatMap(d => d.tracks).map(t => ({ ...t, ...classify(t.name), duck: DUCKS[t.name] ?? null }));
  const byId = new Map();
  for (const d of sets) for (const p of d.players) {
    const k = source === "ul" ? String(p.id).toLowerCase() : p.name.toLowerCase();   // ul: game login
    const m = byId.get(k) || { id: k, name: p.name, nick: p.nick, times: {}, miss: {} };
    Object.assign(m.times, p.times); Object.assign(m.miss, p.miss || {}); byId.set(k, m);
  }
  const players = [...byId.values()].map(p => ({ ...p, count: Object.keys(p.times).length }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  return { label: "All", tracks, players };
}

// The same data restricted to the tracks matching `pred`; players are re-counted on that subset.
function derive(all, label, pred) {
  const tracks = all.tracks.filter(pred), names = new Set(tracks.map(t => t.name));
  const pick = (o) => Object.fromEntries(Object.entries(o || {}).filter(([n]) => names.has(n)));
  const players = all.players.map(p => { const times = pick(p.times); return { ...p, times, miss: pick(p.miss), count: Object.keys(times).length }; })
    .filter(p => p.count > 0).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  return { label, tracks, players };
}

const DATASETS = [["U", "United", "United STM: Nadeo + Star tracks"], ["N", "Nations", "Nations STM"],
                  ["P", "Puzzle", "Puzzle STM"], ["S", "Stunt", "Stunt STM"], ["ALL", "All", "Everything combined"]];
const SOURCES = [["tmx", "Exchange replays"], ["ul", "United Ladder"]].filter(([s]) => DATA.some(d => (d.source || "tmx") === s));
let source = SOURCES[0][0], all, ach = {}, cur;
let ds = "U", sub = { diff: null, env: null };      // selected dataset; United filters (null = All)

function pickDataset() {
  let pred = ds === "ALL" ? () => true : (t) => t.cat === ds, label = DATASETS.find(([k]) => k === ds)[1];
  if (ds === "U") {   // difficulty and environment are independent filters; null = All
    const { diff, env } = sub;
    pred = (t) => t.cat === "U" && (!diff || t.diff === diff) && (!env || t.env === env);
    if (diff) label += " · " + DIFF_NAME[diff];
    if (env) label += " · " + env;
  }
  cur = derive(all, label, pred);
}
const allCache = {};   // merged dataset per source (Merge mode needs both at once)
const getAll = (s) => allCache[s] || (allCache[s] = merge(DATA.filter(d => (d.source || "tmx") === s), s));
function pickSource(s) {
  source = s;
  all = getAll(s);
  ach = {};              // achievements are recomputed lazily (per medal level) for the new source
  pickDataset();
}
pickSource(source);
let view = "players", shown = 100, open = new Set();
const sort = { key: null, dir: "desc" };    // Tracks view sort state; key null = original order
const isort = { key: "pct", dir: "desc" };  // Improvements view sort state
const collapsed = new Set();                // titles of collapsed player-breakdown sections

// Sortable <th>: clicking sorts by `key` (first click: text asc, numbers desc), again flips the direction.
function sortTh(label, key, st, cls = "num", textKey = false) {
  const on = st.key === key;
  return el("th", { className: `${cls} sortable`, tabIndex: 0, textContent: label + (on ? (st.dir === "asc" ? " ▲" : " ▼") : ""),
    ariaSort: on ? (st.dir === "asc" ? "ascending" : "descending") : "none",
    onclick: () => { Object.assign(st, on ? { dir: st.dir === "desc" ? "asc" : "desc" }
                                          : { key, dir: textKey ? "asc" : "desc" }); render(); },
    onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.currentTarget.click(); } } });
}

function ranked(players) {
  let rank = 0, prev = null;
  return players.map((p, i) => { if (p.count !== prev) { rank = i + 1; prev = p.count; } return { ...p, rank }; });
}
const setOf = (d) => Object.fromEntries(d.tracks.map(t => [t.name, t]));

function renderStats() {
  const beaten = cur.tracks.filter(t => t.beaten_by > 0).length;
  const replays = cur.tracks.reduce((a, t) => a + t.replays, 0);
  const items = [[cur.tracks.length, "tracks"],
    [replays.toLocaleString(), source === "ul" ? "records on the leaderboards" : "replays checked"],
    [cur.players.length, "players beating ≥1 STM"], [`${beaten}/${cur.tracks.length}`, "tracks beaten by someone"]];
  $("#stats").replaceChildren(...items.map(([b, s]) => el("div", { className: "stat" }, el("b", { textContent: b }), el("span", { textContent: s }))));
}

function renderPlayers(q) {
  const total = cur.tracks.length, tmap = setOf(cur);
  let rows = ranked(cur.players);
  if (q) rows = rows.filter(p => p.name.toLowerCase().includes(q) || (p.nick || "").toLowerCase().includes(q));
  const tbody = el("tbody");
  rows.slice(0, shown).forEach(p => {
    const tr = el("tr", { className: "player" });
    tr.append(el("td", { className: "rank" + (p.rank <= 3 ? " top" : ""), textContent: p.rank }),
      nameCell(p.name, p.nick, p.id),
      el("td", { className: "num", textContent: `${p.count}/${total}` }),
      el("td", { className: "hide-sm" }, el("div", { className: "bar" }, Object.assign(el("i"), { style: `width:${100 * p.count / total}%` }))));
    tr.onclick = () => { open.has(p.id) ? open.delete(p.id) : open.add(p.id); render(); };
    tbody.append(tr);
    if (open.has(p.id)) {
      const chip = (name, v, miss, far) => {
        const t = tmap[name];

// United Ladder medal results are read gradually (see update.py); say so while some tracks still lack them.
function medalCoverageNote(level) {
  if (source !== "ul" || level.id === "stm") return "";
  const have = all.tracks.filter(t => t.medals_at).length;
  return have >= all.tracks.length ? "" : ` · medal data covers ${have} of ${all.tracks.length} tracks so far`;
}

function achievementData(level) {
  if (ach[level]) return ach[level];
  const f = MEDALS.find(m => m.id === level).f, tmap = setOf(all);
  const tags = [...TAGS_PRIMARY, ...TAGS_UNITED].map(tg => {
    const names = new Set(all.tracks.filter(tg.pred).map(t => t.name));
    return { ...tg, names, total: names.size };
  });
  const players = all.players.map(p => {
    // tracks where the player's best result earns this medal (an STM also earns every medal below it)
    const qual = new Set();
    for (const src of [p.times, p.miss || {}]) for (const name in src) {
      const t = tmap[name];
      if (t && within(t, src[name], medalLimit(t, f))) qual.add(name);
    }
    const n = {};
    for (const tg of tags) { let c = 0; for (const name of qual) if (tg.names.has(name)) c++; n[tg.id] = c; }
    // ducks: tracks where the player is at or under the duck time (always an STM result, so it is in p.times)
    let ducks = 0;
    for (const name in p.times) { const t = tmap[name]; if (t && t.duck != null && within(t, p.times[name], t.duck)) ducks++; }
    return { id: p.id, name: p.name, nick: p.nick, n, ducks };
  });
  return (ach[level] = { tags, players, duckTotal: all.tracks.filter(t => t.duck != null).length });
}

    el("td", { className: "rank" + (i < 3 && asort.key === "default" && asort.dir === "desc" ? " top" : ""), textContent: i + 1 }),
    el("td", { textContent: p.name, title: p.nick ? `${p.name} — ${p.nick}` : p.name }),
    ...tags.map(t => {
      const n = p.n[t.id], full = n === t.total;
      return el("td", { className: "num prog" + (full ? " full" : n === 0 ? " zero" : "") },
        `${full ? "✓ " : ""}${n}/${t.total}`,
        el("div", { className: "bar" }, Object.assign(el("i"), { style: `width:${100 * n / t.total}%` })));
    }),
    ...(hasDucks ? [el("td", { className: "num prog" + (p.ducks === A.duckTotal ? " full" : p.ducks === 0 ? " zero" : "") },
      `${p.ducks === A.duckTotal ? "✓ " : ""}${p.ducks}/${A.duckTotal}`,
      el("div", { className: "bar" }, Object.assign(el("i"), { style: `width:${100 * p.ducks / A.duckTotal}%` })))] : []),
    el("td", { className: "num", textContent: `${done(p)}/${tags.length}` }))));
  const W = { rank: 44, player: 170, tag: 88, duck: 88, done: 70 };   // fixed column widths (px); the tag columns share the rest
  const cols = el("colgroup", {}, el("col", { style: `width:${W.rank}px` }), el("col", { style: `width:${W.player}px` }),
    ...tags.map(() => el("col")), ...(hasDucks ? [el("col", { style: `width:${W.duck}px` })] : []), el("col", { style: `width:${W.done}px` }));
  const minWidth = W.rank + W.player + W.done + (hasDucks ? W.duck : 0) + tags.length * W.tag;   // narrower screens scroll sideways instead of squeezing
  const out = [bar, el("table", { className: "achv", style: `min-width:${minWidth}px` }, cols, head, tbody)];
  if (rows.length > shown) out.push(el("button", { className: "more", textContent: `Show more (${rows.length - shown} left)`,
    onclick: () => { shown += 200; render(); } }));
  return out;
}

// --- Merge mode: combine a United Ladder login and an exchange name into one set of times
const mg = { ul: "", ex: "" };
try { Object.assign(mg, JSON.parse(localStorage.getItem("stm-merge") || "{}")); } catch (e) { /* storage unavailable */ }
const saveMerge = () => { try { localStorage.setItem("stm-merge", JSON.stringify(mg)); } catch (e) { /* ignore */ } };
const TAG_GROUPS = [["Primary tags", TAGS_PRIMARY], ["Difficulty tags", TAGS_DIFF], ["Environment tags", TAGS_ENV]];
const findPlayer = (s, q) => { const k = q.trim().toLowerCase();
  return getAll(s).players.find(p => p.id === k || p.name.toLowerCase() === k) || null; };

function renderMerge() {
  const ulQ = mg.ul.trim(), exQ = mg.ex.trim();
  if (!ulQ && !exQ) return [el("div", { className: "empty", textContent:
    "Type your United Ladder login and/or your exchange name above. Your times from both are merged, and you see your progress towards every tag and which ones are closest." })];
  const ulP = ulQ ? findPlayer("ul", ulQ) : null, exP = exQ ? findPlayer("tmx", exQ) : null;
  const notices = [];
  if (ulQ && !ulP) notices.push(`No United Ladder player "${ulQ}" found. Check the login (it is not the nickname); players only appear once they beat at least one STM.`);
  if (exQ && !exP) notices.push(`No exchange player "${exQ}" found. Check the name; players only appear once they beat at least one STM.`);
  const noteEls = notices.map(t => el("div", { className: "notice", textContent: t }));
  if (!ulP && !exP) return noteEls;

  const tracks = getAll(SOURCES[0][0]).tracks;                    // the same tracks in both sources
  const has = (p, n) => !!p && p.times[n] != null;
  const beat = (n) => has(ulP, n) || has(exP, n);
  const count = (pred) => tracks.filter(t => pred(t.name)).length;
  const nUl = count(n => has(ulP, n)), nEx = count(n => has(exP, n)), nAll = count(beat);
  const tiles = [[`${nAll}/${tracks.length}`, "tracks beaten (merged)"],
    [nUl, ulP ? `from United Ladder (${ulP.name})` : "from United Ladder"],
    [nEx, exP ? `from exchange (${exP.name})` : "from exchange"],
    [ulP && exP ? `+${nAll - Math.max(nUl, nEx)}` : "–", "gained by merging"]];

  const rows = TAG_GROUPS.flatMap(([group, list]) => list.map(g => {
    const names = tracks.filter(g.pred).map(t => t.name);
    if (!names.length) return null;
    return { ...g, group, total: names.length, n: names.filter(beat).length,
             nUl: names.filter(n => has(ulP, n)).length, nEx: names.filter(n => has(exP, n)).length,
             missing: names.filter(n => !beat(n)) };
  })).filter(Boolean);

  // Tracks still to beat, nearest to the STM first: your best result on a track that did not make it
  // (from either source), measured against the STM.
  const tmap = Object.fromEntries(tracks.map(t => [t.name, t]));
  const bestMiss = (n) => { const t = tmap[n], c = [ulP?.miss?.[n], exP?.miss?.[n]].filter(v => v != null);
    return c.length ? (t.mode === "score" ? Math.max(...c) : Math.min(...c)) : null; };
  const gap = (n) => { const v = bestMiss(n), t = tmap[n];
    return v == null ? Infinity : ((t.mode === "score" ? t.set - v : v - t.set) / t.set); };
  const chip = (n) => { const t = tmap[n], v = bestMiss(n);
    return el("a", { className: "chip miss", href: link(t), target: "_blank", rel: "noopener" }, n,
      el("em", { textContent: `STM ${fv(t, t.set)}` + (v == null ? "" : ` · you ${fv(t, v)} (${missBy(t, v)})`) })); };

  const closest = rows.filter(r => r.n < r.total)
    .sort((a, b) => (a.total - a.n) - (b.total - b.n) || b.n / b.total - a.n / a.total);
  const closestEls = closest.length
    ? closest.slice(0, 6).map((r, i) => {
        const d = el("details", { className: "sec", open: i === 0 },
          el("summary", { textContent: `${r.name} (${r.group.replace(" tags", "").toLowerCase()}) · ${r.total - r.n} left · ${r.n}/${r.total}` }),
          el("div", { className: "chips" }, ...[...r.missing].sort((a, b) => gap(a) - gap(b) || a.localeCompare(b, undefined, { numeric: true })).map(chip)));
        return d; })
    : [el("div", { className: "muted", textContent: "Every tag is complete. 🎉" })];

  const tbody = el("tbody");
  for (const [group] of TAG_GROUPS) {
    const list = rows.filter(r => r.group === group);
    if (!list.length) continue;
    tbody.append(el("tr", { className: "grouprow" }, el("td", { colSpan: 5, textContent: group })));
    list.forEach(r => {
      const full = r.n === r.total;
      tbody.append(el("tr", {},
        el("td", {}, ...(r.dot ? [el("i", { className: "dot", style: `background:${r.dot}` })] : []), r.name),
        el("td", { className: "hide-sm" }, el("div", { className: "bar" }, Object.assign(el("i"), { style: `width:${100 * r.n / r.total}%` }))),
        el("td", { className: "num prog" + (full ? " full" : "") , textContent: `${full ? "✓ " : ""}${r.n}/${r.total}` }),
        el("td", { className: "num muted", textContent: ulP ? `${r.nUl}` : "–" }),
        el("td", { className: "num muted", textContent: exP ? `${r.nEx}` : "–" })));
    });
  }
  const table = el("table", {}, el("thead", {}, el("tr", {}, el("th", { textContent: "Tag" }), el("th", { className: "hide-sm" }),
    el("th", { className: "num", textContent: "Merged" }), el("th", { className: "num", textContent: "United Ladder" }),
    el("th", { className: "num", textContent: "Exchange" }))), tbody);

  return [...noteEls,
    el("div", { className: "mpad" }, el("div", { className: "stats" }, ...tiles.map(([b, l]) =>
      el("div", { className: "stat" }, el("b", { textContent: b }), el("span", { textContent: l }))))),
    el("div", { className: "mhead", textContent: "Tags earned" }),
    el("div", { className: "mpad" }, rows.some(r => r.n === r.total)
      ? el("div", { className: "tags" }, ...rows.filter(r => r.n === r.total).map(tagImg))
      : el("div", { className: "muted", textContent: "None yet. A tag needs every STM of its category." })),
    el("div", { className: "mhead", textContent: "Closest to completing" }),
    el("div", { className: "mpad" }, ...closestEls),
    el("div", { className: "mhead", textContent: "All tags" }), table];
}

const NOTES = {
  common: "A time faster than or equal to the STM (or, on stunt tracks, a score higher than or equal to it) counts as a beat; each player counts at most once per track. Super Gold, Super Silver and Super Bronze lie 12.5%, 25% and 50% of the way from the STM towards the track's author medal (RTM), rounded up. Ducks are per-track times faster than the STM (ducks.csv); you have a duck on a track when your time is faster than or equal to it.",
  tmx: "Data: replays uploaded to tmuf.exchange and tmnf.exchange. Players are matched by name, because user ids differ between tmuf and tmnf.",
  ul: "Data: the official in-game leaderboards via the UnitedLadder API (api.ul.unitedascenders.xyz); players are matched by game login. Medal results are read from the leaderboards down to the Super Bronze time, so there is no \"slower than Super Bronze\" section.",
};
const SUBS = { tmx: "How many tracks each player has a replay faster than the STM · data from tmuf.exchange & tmnf.exchange",
               ul: "How many tracks each player has an official record faster than the STM · data from UnitedLadder" };

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const merging = view === "merge";
  $("#sub").textContent = merging ? "Merge your United Ladder and exchange times · progress towards every tag" : SUBS[source];
  $("#note").textContent = merging
    ? "Merged: a track counts as beaten if either your United Ladder record or your exchange replay is at or under the STM. " + NOTES.common
    : `${NOTES.common} ${NOTES[source]}`;
  $("#gen").textContent = META.updated ? `Data updated ${new Date(META.updated).toLocaleString()}.` : "Generated __GENERATED__.";
  $("#stats").hidden = view === "achievements" || merging;
  if (!$("#stats").hidden) renderStats();
  $("#out").replaceChildren(...({ players: renderPlayers, tracks: renderTracks, improvements: renderImprovements,
                                  news: renderNew, achievements: renderAchievements, merge: renderMerge }[view](q)));
}

function buildDatasetButtons() {
  $("#datasets").hidden = view === "achievements" || view === "merge";      // these views span every dataset
  $("#datasets").replaceChildren(...DATASETS.map(([k, label, tip]) => el("button", {
    textContent: label, title: tip, ariaPressed: String(k === ds),
    onclick: () => { ds = k; sub = { diff: null, env: null }; pickDataset(); shown = 100; open.clear();
      buildDatasetButtons(); buildSubButtons(); render(); } })));
}
function buildSubButtons() {   // United filters: difficulty and environment, side by side, each with "All"
  const box = $("#subtabs");
  box.hidden = !(ds === "U" && view !== "achievements" && view !== "merge");
  if (box.hidden) return;
  const choose = (key, value) => { sub = { ...sub, [key]: value }; pickDataset(); shown = 100; open.clear(); buildSubButtons(); render(); };
  const mk = (label, key, value, dot) => el("button", {
    ariaPressed: String(sub[key] === value), onclick: () => choose(key, value) },
    ...(dot ? [el("i", { className: "dot", style: `background:${dot}` })] : []), label);
  box.replaceChildren(
    el("div", { className: "seg", role: "group", ariaLabel: "Difficulty" },
      mk("All", "diff", null), ...DIFFS.map(([c, n, dot]) => mk(n, "diff", c, dot))),
    el("div", { className: "seg", role: "group", ariaLabel: "Environment" },
      mk("All", "env", null), ...ENVS.map(e => mk(e, "env", e))));
}
function buildSourceButtons() {
  $("#sources").hidden = SOURCES.length < 2 || view === "merge";     // merge mode uses both sources
  $("#sources").replaceChildren(...SOURCES.map(([id, label]) => el("button", {
    textContent: label, ariaPressed: String(id === source),
    onclick: () => { pickSource(id); shown = 100; open.clear(); buildSourceButtons(); buildDatasetButtons(); buildSubButtons(); render(); } })));
}
buildSourceButtons();
buildDatasetButtons();
buildSubButtons();
document.querySelectorAll("#views button").forEach(b => b.onclick = () => {
  view = b.dataset.view; shown = 100;
  document.querySelectorAll("#views button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  buildSourceButtons(); buildDatasetButtons(); buildSubButtons(); syncMerge(); render(); });
$("#q").oninput = () => { shown = 100; render(); };

// Merge mode: its two inputs live outside #out so typing never loses focus when the results re-render.
function syncMerge() {
  const on = view === "merge";
  $("#mergebar").hidden = !on;
  $("#q").hidden = on;
  if (!on || $("#dl-ul").childElementCount) return;
  const names = (s) => getAll(s).players.map(p => p.name).sort((a, b) => a.localeCompare(b)).map(v => el("option", { value: v }));
  $("#dl-ul").replaceChildren(...names("ul"));
  $("#dl-ex").replaceChildren(...names("tmx"));
}
if (location.protocol.startsWith("http")) $("#csv").hidden = false;     // the CSV sits next to the page when it is served
if (SOURCES.length < 2) document.querySelector("[data-view=merge]").hidden = true;   // needs both sources
$("#mg-ul").value = mg.ul; $("#mg-ex").value = mg.ex;
$("#mg-ul").oninput = (e) => { mg.ul = e.target.value; saveMerge(); render(); };
$("#mg-ex").oninput = (e) => { mg.ex = e.target.value; saveMerge(); render(); };
$("#theme").onclick = () => {
  const r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = r.dataset.theme || (dark ? "dark" : "light");
  r.dataset.theme = now === "dark" ? "light" : "dark"; };
render();
</script>
<script>
// Fetch the data, then run the page code above (kept in the type="text/plain" block so it waits for the data).
fetch("site-data.json?v=__BUILD__")
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(d => { window.SITE_DATA = d; const s = document.createElement("script");
               s.textContent = document.getElementById("app").textContent; document.body.append(s); })
  .catch(e => { document.getElementById("out").textContent = "Could not load site-data.json (" + e.message +
                "). Open the site over http(s), for example the GitHub Pages link, not straight from a file."; });
</script>
</body>
